name: CI

# 每次推送 main 或提交 PR 时，对三端各做一次真实构建，并在空库上真跑一遍数据库迁移。
# 目的是「合并前就能知道编译不过 / 迁移跑不通」，而不是等部署时才发现。

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支连续推送时，取消上一次未完成的运行，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------- 后端 ----------------
  server:
    name: Server · Maven / JDK 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -DskipTests 只跳过「执行」，测试源码仍会被编译。
      # 这一点很重要：改包名、改签名时测试目录最容易漏，
      # 编译到它就能立刻发现（唯一的 @SpringBootTest 需要 MySQL/Redis，CI 里跑不了）
      - name: Package
        working-directory: coolpilot-server
        run: mvn -B -ntp -DskipTests package

      # 角色语义守卫（T-103）：
      # 角色字面量只允许出现在 constant/Role.java 的兼容映射里，
      # 业务代码一律引用 Role.OWNER / Role.USER。
      # 否则下次又要靠人肉 review 才发现某处还在写 hasRole("admin")。
      - name: 角色字面量检查
        working-directory: coolpilot-server
        run: |
          if grep -rn --include=*.java -E '"ROLE_(admin|visitor)"' src/main/java | grep -v 'constant/Role.java'; then
            echo "::error::发现历史角色字面量，请改用 Role.OWNER / Role.USER（兼容映射只能存在于 constant/Role.java）"
            exit 1
          fi
          echo "角色字面量检查通过"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: coolpilot-server/target/*.jar
          retention-days: 7

  # ---------------- 数据库迁移 ----------------
  # 迁移脚本是表结构的唯一来源，写错一条就等于发布一个起不来的版本。
  # 这里在一个空 MySQL 上真跑一遍，顺带断言表数量对得上。
  migrations:
    name: Migrations · 空库跑通
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pass
          MYSQL_DATABASE: coolpilot
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-pass --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4

      # service 容器把 3306 映射到 runner 的 localhost，
      # Flyway 容器用 host 网络就能连上；参数与 application-dev.properties 保持一致
      - name: Migrate empty schema
        run: |
          docker run --rm --network host \
            -v "$PWD/coolpilot-server/src/main/resources/db/migration:/flyway/sql" \
            flyway/flyway:11 \
            -url="jdbc:mysql://127.0.0.1:3306/coolpilot?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC" \
            -user=root \
            -password=ci-root-pass \
            -baselineOnMigrate=true \
            -baselineVersion=2 \
            -validateOnMigrate=true \
            migrate

      # 表数量是最省事的健全性检查：漏了建表、脚本顺序错了都会体现出来。
      # 用下限而不是等值：后续版本还会加表，等值断言每加一张表就要改 CI。
      - name: Assert schema built
        run: |
          COUNT=$(docker run --rm --network host mysql:8.0 \
            mysql -h 127.0.0.1 -uroot -pci-root-pass -N -B \
            -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='coolpilot' AND table_name <> 'flyway_schema_history'")
          echo "业务表数量: $COUNT"
          test "$COUNT" -ge 53 || { echo "期望至少 53 张业务表，实际 $COUNT"; exit 1; }

          # 关键表逐个点名：数量对得上但少了某张表的情况也要拦住
          for T in user blog product orders payment refund entitlement demand quote project milestone delivery service_item service_event kb_document kb_chunk topic topic_article ai_conversation ai_message; do
            EXISTS=$(docker run --rm --network host mysql:8.0 \
              mysql -h 127.0.0.1 -uroot -pci-root-pass -N -B \
              -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='coolpilot' AND table_name='$T'")
            test "$EXISTS" = "1" || { echo "缺少表: $T"; exit 1; }
          done
          echo "关键表检查通过"

          SEED=$(docker run --rm --network host mysql:8.0 \
            mysql -h 127.0.0.1 -uroot -pci-root-pass -N -B -D coolpilot \
            -e "SELECT COUNT(*) FROM site_setting")
          echo "站点配置项: $SEED"
          test "$SEED" -ge 30 || { echo "种子数据缺失，site_setting 只有 $SEED 项"; exit 1; }

  # ---------------- 管理后台 ----------------
  admin:
    name: Admin · Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: coolpilot-admin/package-lock.json

      # 用 ci 而不是 install：锁文件必须与 package.json 一致，否则直接失败
      - name: Install
        working-directory: coolpilot-admin
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: coolpilot-admin
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: coolpilot-admin/dist
          retention-days: 7

  # ---------------- 前台 ----------------
  web:
    name: Web · Nuxt build
    runs-on: ubuntu-latest
    env:
      NUXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: coolpilot-web/package-lock.json

      - name: Install
        working-directory: coolpilot-web
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: coolpilot-web
        run: npm run build

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: web-output
          path: coolpilot-web/.output
          retention-days: 7
