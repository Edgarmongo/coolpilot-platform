name: Release

# 打 tag（v1.2.0 这种）或手动触发时，构建三个生产镜像推到 GHCR。
# 镜像推上去之后，服务器只需要 pull 新 tag，不用在机器上装 JDK/Node。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号（如 v1.2.0），留空则用当前 commit 短 SHA'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------- 构建并推送三个镜像 ----------------
  images:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: coolpilot-server
            dockerfile: deploy/docker/server/Dockerfile
          - image: coolpilot-admin
            dockerfile: deploy/docker/admin/Dockerfile
          - image: coolpilot-web
            dockerfile: deploy/docker/web/Dockerfile.prod
    steps:
      - uses: actions/checkout@v4

      # GHCR 要求仓库名全小写，而 GitHub 用户名可能含大写（Edgarmongo）
      - name: Resolve image name
        id: img
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=${REGISTRY}/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 三个镜像复用同一层缓存，回滚构建会快很多
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ---------------- 部署到服务器（可选） ----------------
  # 默认不执行。在仓库 Settings → Secrets and variables → Actions 里：
  #   Variables: DEPLOY_ENABLED=true
  #   Secrets:   DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PATH
  # 服务器上需事先放好 docker-compose.prod.yml 与 .env
  deploy:
    name: Deploy over SSH
    needs: images
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Pull new images and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            # tag 发布用版本号，手动触发用 SHA
            export TAG="${{ github.ref_type == 'tag' && github.ref_name || github.sha }}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
