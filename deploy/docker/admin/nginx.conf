# ============================================================
# 管理后台的 nginx 配置（生产）
#
# 两个职责：
#   1. 托管 /cms/ 下的静态产物（vite base 就是 /cms/）
#   2. 把 /api/** 反代给后端，并去掉 /api 前缀
#      —— 与开发时 vite 的 proxy rewrite 行为完全一致，
#         所以前端代码里的 baseURL('/api/admin/') 不用改
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端允许 100MB 的上传（商品资源、付款凭证）
    client_max_body_size 100m;

    # 单页应用：刷新 /cms/trade/orders 这类深链接时要回落到 index.html
    #
    # index.html 必须禁用缓存：它决定加载哪份带 hash 的 assets。
    # 一旦被浏览器缓存，发布新版后用户仍按旧 hash 请求，表现为
    # 「菜单没更新」；旧文件被清理时还会直接白屏。
    # /cms/assets/ 有更长的前缀匹配，走下面那条长期缓存，不受影响。
    location /cms/ {
        try_files $uri $uri/ /cms/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 构建产物文件名带 hash，可以放心长期缓存
    location /cms/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 接口反代。proxy_pass 结尾的斜杠会把 /api/ 替换成 /，
    # 即 /api/admin/login → http://api:8091/admin/login
    location /api/ {
        proxy_pass http://api:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传/导出不要被默认 60s 掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = / {
        return 302 /cms/;
    }
}
