<!DOCTYPE html>
<html lang="zh_CN" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="UTF-8">
	<title th:text="${siteName}">CoolSkyAI</title>
</head>
<body style="margin:0;padding:24px 0;background:#f5f7f7;">
<div style="width:560px;max-width:92%;margin:0 auto;background:#ffffff;border:1px solid #e8eded;border-radius:10px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
	<div style="height:6px;background:#0f766e;"></div>
	<div style="padding:24px 26px 6px;">
		<div style="font-size:12px;color:#6b7280;letter-spacing:.4px;" th:text="${siteName}">CoolSkyAI</div>
		<h1 style="margin:8px 0 0;font-size:18px;line-height:1.5;color:#111827;font-weight:650;"
		    th:text="${title}">通知标题</h1>
	</div>
	<div style="padding:14px 26px 0;color:#374151;font-size:14px;line-height:1.8;">
		<p style="margin:0 0 12px;white-space:pre-wrap;" th:text="${content}">通知内容</p>
	</div>
	<div style="padding:6px 26px 0;">
		<a th:if="${linkUrl != null and linkUrl != ''}" th:href="${linkUrl}" target="_blank"
		   style="display:inline-block;padding:9px 20px;background:#0f766e;color:#ffffff;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;">
			查看详情
		</a>
	</div>
	<div style="padding:18px 26px 24px;border-top:1px solid #f0f3f3;margin-top:20px;color:#9ca3af;font-size:12px;line-height:1.7;">
		<div th:text="|发送时间：${#dates.format(time,'yyyy-MM-dd HH:mm')}|">发送时间</div>
		<div>这封邮件由系统自动发送，直接回复可能不会被看到。</div>
	</div>
</div>
</body>
</html>
