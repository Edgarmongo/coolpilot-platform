# 服务器端口号
server.port=8091
# 博客名称
blog.name=CoolSkyAI
# 生产环境需要修改为服务器ip或域名
# 后端服务URL https://api.coolskyai.com/blog
blog.api=http://localhost:${server.port}
#生产
#blog.api=http://192.236.184.68:${server.port}
# 后台管理URL https://admin.coolskyai.com
#blog.cms=http://localhost:8080
#blog.cms=http://192.236.184.68:8080
# 前台界面URL https://coolskyai.com
#blog.view=http://localhost:8081
# 邮件/分享链接里的站点地址，上线后设 BLOG_VIEW=https://coolskyai.com
blog.view=${BLOG_VIEW:http://192.236.184.68:8081}
# 数据库连接信息
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/coolpilot?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# 密码不落仓库：容器内由 compose 注入 SPRING_DATASOURCE_PASSWORD，
# 本地直跑用  DB_PASSWORD=xxx  ./mvnw spring-boot:run
spring.datasource.password=${DB_PASSWORD:}
# Redis连接信息
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
#spring.data.redis.host=192.236.184.68
spring.data.redis.password=${REDIS_PASSWORD:}
#spring.data.redis.password=
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.database=0
spring.data.redis.timeout=10000ms

# ---------------- Flyway 数据库迁移 ----------------
# 迁移脚本在 classpath:db/migration，按 V1__ / V2__ 顺序执行一次，
# 记录写在 flyway_schema_history 表里，重复启动不会重跑。
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
# 已有库（表已建、数据在）首次接入时不要报错，而是把它标记为 baseline 版本，
# 从下一个版本开始接管；空库则正常从 V1 全量执行。
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.baseline-description=existing schema and seed before flyway
# 脚本一旦执行过就不要再改，checksum 对不上要能立刻发现
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
# 迁移失败时中断启动，不要带着半截结构跑业务
spring.flyway.fail-on-missing-locations=true

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.coolskyai.entity
# 日志级别配置
logging.level.root=info
logging.level.com.coolskyai=debug
logging.file.name=coolpilot-server/log/blog-dev

token.expireTime=259200000
# JWT签名密钥：通过环境变量 JWT_SECRET 注入，冒号后为本地开发默认值。
# 生产环境必须显式设置 JWT_SECRET（>=64位随机串），否则仍会使用下面这份公开的默认值。
# 注意：更换密钥会使所有已签发的 token 立即失效，属于预期行为。
token.secretKey=${JWT_SECRET:8xK2x5ykEpzZBtTKYOS51AiLljErXxvIqyQk606oTsHynOuUoghMQYUmp7uVxM5r}

# 博主接收评论提醒方式: Telegram=tg 邮箱=mail (访客评论提醒固定为邮箱方式)
comment.notify.channel=mail
# 新评论是否默认公开
comment.default-open=true

# 如果选择邮箱提醒方式，则会在收到评论后向填写的邮箱自身发送一封邮件(提醒自己)；如果选择tg，则填写的邮箱只作为提醒访客的发送方
# 阿里云邮箱，其它邮箱服务商配置参考关键字"spring mail 服务器"
spring.mail.host=smtp.mxhichina.com
spring.mail.port=465
spring.mail.username=admin@example.com
# 邮件密码不落仓库：容器内由 MAIL_PASSWORD 注入
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.ssl.enable=true

# 如果选择邮箱提醒方式，以下可以无需修改
tg.bot.api=https://api.telegram.org/bot
# bot的token，可以从 @BotFather 处获取
tg.bot.token=1234567890:qwertyuiopasdfghjklzxcvbnm
# 自己账号和bot的聊天会话id
tg.bot.chat-id=1234567890
# 是否使用代理
tg.bot.use-proxy=false
# 是否使用反向代理
tg.bot.use-reverse-proxy=true
# 反向代理URL，请自行搭建，示例API随时可能关闭
tg.bot.reverse-proxy-url=https://tg-api-open.coolskyai.workers.dev

# 代理配置，如不使用无需修改 (目前用于发送Telegram请求)
http.proxy.server.host=127.0.0.1
http.proxy.server.port=7890
http.proxy.server.timeout=10000

# 评论中QQ头像存储方式: 本地:local GitHub:github 又拍云:upyun
upload.channel=local

# 静态文件上传访问路径 Windows环境例如: C:/Users/nblog/Desktop/upload/ Linux环境例如：/home/nblog/upload/
upload.file.path=./upload/
upload.file.access-path=/image/**
upload.file.resources-locations=file:${upload.file.path}

# 如果选择其它上传方式，以下可以无需修改
# GitHub token 教程见 https://github.com/Edgarmongo/PictureHosting/#/pictureHosting/help
upload.github.token=ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
upload.github.username=Edgarmongo
# 需要用作图床的GitHub仓库名
upload.github.repos=test
# 需要上传至仓库的路径 开头需要"/" 结尾不要"/"
upload.github.repos-path=/comment/avatar

# 又拍云存储空间名称，帮助文档见 https://help.upyun.com/knowledge-base/quick_start/
upload.upyun.bucket-name=nblog
# 操作员名称
upload.upyun.username=naccl
# 操作员密码
upload.upyun.password=xxxxxxxxxxxxxxxxxxxxxxxxxxxx
# 存储路径
upload.upyun.path=/comment/avatar
# CDN访问域名
upload.upyun.domain=https://cdn.example.com

# 文件上传限制（课件、代码包可能较大）
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# 是否信任 X-Forwarded-For（仅在可信反向代理会覆盖该头时打开）
# 打开后限流/友链去重按真实客户端 IP 计算；直接暴露 8091 时必须保持 false，否则可伪造
security.trust-forwarded-for=false

# 允许跨域的来源（逗号分隔）。前端都走同源代理，正常浏览不需要跨域；
# 这里列出本地开发端口，便于直接用浏览器调试接口。生产改由环境变量覆盖。
cors.allowed-origins=http://localhost:8081,http://localhost:8079,http://127.0.0.1:8081,http://127.0.0.1:8079

# 知识库检索（V1.3 第一阶段）
# 向量由本地哈希实现生成（512 维），换远程模型后需要重建索引
ai.search.min-score=0.05
ai.search.cache-seconds=300
ai.search.max-limit=20
