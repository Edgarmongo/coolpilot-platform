# 生产环境必须显式设置 JWT_SECRET（>=64位随机串），否则仍会使用下面这份公开的默认值。
# 注意：更换密钥会使所有已签发的 token 立即失效，属于预期行为。
token.secretKey=${JWT_SECRET:8xK2x5ykEpzZBtTKYOS51AiLljErXxvIqyQk606oTsHynOuUoghMQYUmp7uVxM5r}

# 博主接收评论提醒方式: Telegram=tg 邮箱=mail (访客评论提醒固定为邮箱方式)
