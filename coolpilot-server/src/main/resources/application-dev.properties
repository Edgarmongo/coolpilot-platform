# 文件上传限制（课件、代码包可能较大）
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# 是否信任 X-Forwarded-For（仅在可信反向代理会覆盖该头时打开）
# 打开后限流/友链去重按真实客户端 IP 计算；直接暴露 8091 时必须保持 false，否则可伪造
security.trust-forwarded-for=false

# 允许跨域的来源（逗号分隔）。前端都走同源代理，正常浏览不需要跨域；
# 这里列出本地开发端口，便于直接用浏览器调试接口。生产改由环境变量覆盖。
cors.allowed-origins=http://localhost:8081,http://localhost:8079,http://127.0.0.1:8081,http://127.0.0.1:8079

# 知识库检索（V1.3 第一阶段）
# 混合打分：mixed = alpha * 向量相似度 + (1 - alpha) * 字面覆盖率
# alpha 越大越吃语义，越小越吃关键词；0.72 是「语义为主、关键词兜底」
ai.search.min-score=${AI_SEARCH_MIN_SCORE:0.25}
ai.search.cache-seconds=300
ai.search.max-limit=20
ai.search.hybrid-alpha=${AI_SEARCH_HYBRID_ALPHA:0.65}
# 完全没有字面重合时，向量相似度必须达到这个值才算命中（语义模型的余弦普遍偏高）
ai.search.semantic-floor=${AI_SEARCH_SEMANTIC_FLOOR:0.5}
# 标题命中加成（标题覆盖率 × 该系数）
ai.search.title-boost=${AI_SEARCH_TITLE_BOOST:0.15}

# ---- 追问改写 ----
# 会话里的短追问（「那退款呢」）先补全成独立问题再检索；失败自动回退到原话
ai.chat.rewrite-enabled=${AI_CHAT_REWRITE:true}
# 短于这个长度的问题直接当作追问，超过则看是否含指代词
ai.chat.rewrite-min-length=12
# 带进 prompt 的历史轮数（值会截断到 60 字）
ai.chat.rewrite-history=${AI_CHAT_REWRITE_HISTORY:3}
# 带进 prompt 的回答轮数：序号指代常指向「上一条」回答里的列表
ai.chat.rewrite-answer-rounds=${AI_CHAT_REWRITE_ANSWER_ROUNDS:2}
# 单条回答进 prompt 的节选长度（300 字≈能看全列表前三条）；0=完全不用回答内容
ai.chat.rewrite-answer-length=${AI_CHAT_REWRITE_ANSWER:300}
# 回答节选总预算：超出则按轮数均分
ai.chat.rewrite-answer-budget=${AI_CHAT_REWRITE_ANSWER_BUDGET:600}
ai.chat.rewrite-history-length=60
# 改写结果缓存时间（秒）：同一句话 + 同一段历史只花一次钱
ai.chat.rewrite-cache-seconds=${AI_CHAT_REWRITE_CACHE:3600}

# ---- 重排 ----
# none：不重排；llm：用对话模型做列表排序（无需额外模型）；http：bge-reranker 服务
ai.rerank.enabled=${AI_RERANK_ENABLED:true}
ai.rerank.provider=${AI_RERANK_PROVIDER:none}
ai.rerank.base-url=${AI_RERANK_BASE_URL:}
ai.rerank.path=${AI_RERANK_PATH:/rerank}
ai.rerank.api-key=${AI_RERANK_API_KEY:}
ai.rerank.model=${AI_RERANK_MODEL:bge-reranker-v2-m3}
ai.rerank.timeout-seconds=${AI_RERANK_TIMEOUT:10}
# 第一轮多取多少候选交给重排挑
ai.rerank.candidates=${AI_RERANK_CANDIDATES:20}
# 每个候选送进重排的正文长度
ai.rerank.excerpt-length=160
# 严格度：strict / balanced / loose，决定「截断下限」与「http 相对下限」的默认取值
ai.rerank.strictness=${AI_RERANK_STRICTNESS:balanced}
# 截断下限：留空则按严格度推导（strict=1 / balanced=2 / loose=3），显式值优先
ai.rerank.min-keep=${AI_RERANK_MIN_KEEP:}
# http 重排的分数形态：auto（默认，出现负数或 >1 判定为 logits）/ logit / probability
# logits 会先过 sigmoid 统一到 0~1，阈值才有可比性
ai.rerank.score-mode=${AI_RERANK_SCORE_MODE:auto}
# 相对下限：低于「首位分数 × 该系数」的丢弃；留空按严格度推导（0.7 / 0.5 / 0.35）
ai.rerank.relative-floor=${AI_RERANK_RELATIVE_FLOOR:}
# 模型判「都不相关」时的兜底分数线，留空按严格度推导（0.6 / 0.5 / 0.35）
ai.rerank.empty-keep-score=${AI_RERANK_EMPTY_KEEP:}
# 绝对下限（0~1）：确定要卡死某条线时才填，0=不启用
ai.rerank.min-score=${AI_RERANK_MIN_SCORE:0}
# 重排结果缓存时间（秒），0=不缓存
ai.rerank.cache-seconds=${AI_RERANK_CACHE:900}

# ---- 向量模型 ----
# hashing：本地 n-gram 哈希（512 维，离线可用，字面召回）
# openai ：任意 OpenAI 兼容 /embeddings 端点（语义召回）
# 换 provider 或 dim 之后必须重建索引，否则旧向量会被跳过（后台 stats 里 ignoredChunks 可见）
ai.embedding.provider=${AI_EMBEDDING_PROVIDER:hashing}
ai.embedding.base-url=${AI_EMBEDDING_BASE_URL:}
ai.embedding.api-key=${AI_EMBEDDING_API_KEY:}
ai.embedding.model=${AI_EMBEDDING_MODEL:}
# 必须与模型实际维度一致：bge-m3=1024，text-embedding-3-small=1536
ai.embedding.dim=${AI_EMBEDDING_DIM:1024}
ai.embedding.timeout-seconds=${AI_EMBEDDING_TIMEOUT:30}
ai.embedding.batch-size=${AI_EMBEDDING_BATCH:16}

# 业务通知（订单 / 退款 / 需求 / 项目）的邮件开关。
# 站内消息不受此开关影响，永远写；没有 MAIL_PASSWORD 时也只会写站内消息。
notify.mail.enabled=true

# ---- 大模型（OpenAI 兼容协议）----
# 留空 = 不启用生成，问答只返回检索片段（功能可用、不花钱）
# 本地 Ollama：  http://127.0.0.1:11434/v1      模型如 qwen2.5:7b（通常不需要 Key）
# 本地 vLLM：    http://127.0.0.1:8000/v1
# DeepSeek：     https://api.deepseek.com/v1   模型 deepseek-chat
# 通义千问：      https://dashscope.aliyuncs.com/compatible-mode/v1   模型 qwen-plus
ai.llm.base-url=${AI_LLM_BASE_URL:}
ai.llm.api-key=${AI_LLM_API_KEY:}
ai.llm.model=${AI_LLM_MODEL:}
ai.llm.timeout-seconds=${AI_LLM_TIMEOUT:60}
ai.llm.max-tokens=${AI_LLM_MAX_TOKENS:800}
ai.llm.temperature=${AI_LLM_TEMPERATURE:0.3}
# 额外请求字段（JSON），原样并入请求体；核心字段不可覆盖
# DeepSeek V4 默认开思考模式，只要正文时填 {"thinking":{"type":"disabled"}}
ai.llm.extra-body=${AI_LLM_EXTRA_BODY:}
# 问答取资料的门槛：低于它的片段不进上下文。
# 与搜索侧保持一致 —— 检索分数量纲已经变了，早先的 0.08 是哈希向量时代的经验值
ai.chat.min-score=${AI_CHAT_MIN_SCORE:0.25}
