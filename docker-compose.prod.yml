# ============================================================
# CoolPilot 生产环境（镜像来自 GHCR，不在本地编译）
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# 与 docker-compose.yml 的差别：
#   1. 三个应用服务用 image 而不是 build —— 服务器上不需要 JDK / Node / 源码
#   2. 前台跑 Nitro 生产产物（非 nuxt dev），后台跑 nginx 静态（非 vite dev）
#   3. 不再 bind mount 源码，前后端都是不可变镜像，回滚 = 换 tag
#   4. MySQL / Redis 不对外映射端口
#
# 常用变量（写在 .env 里）：
#   REGISTRY=ghcr.io/edgarmongo
#   TAG=latest            # 或某个 git tag，回滚就改这里
#   MYSQL_ROOT_PASSWORD / REDIS_PASSWORD / JWT_SECRET
#   SITE_URL=https://coolskyai.com   # 拼图片直链、CORS 用
# ============================================================

name: coolpilot

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------- MySQL ----------------
  mysql:
    image: mysql:8.0
    container_name: coolpilot-mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: coolpilot
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      # 表结构与基础数据由应用启动时的 Flyway 迁移负责（coolpilot-server/src/main/resources/db/migration），
      # 不再挂 initdb 脚本：两套初始化机制并存会导致「结构由谁创建」不可控。
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------- Redis ----------------
  redis:
    image: redis:7-alpine
    container_name: coolpilot-redis
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- 后端 API ----------------
  api:
    image: ${REGISTRY:-ghcr.io/edgarmongo}/coolpilot-server:${TAG:-latest}
    container_name: coolpilot-server
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/coolpilot?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # 允许跨域的来源：生产收紧到站点域名，多个用逗号分隔
      CORS_ALLOWED_ORIGINS: ${SITE_URL:-https://coolskyai.com}
      # 生产固定走 gateway，而 gateway 会用 $remote_addr 覆盖该头，
      # 所以这里默认 true，让限流/去重按真实客户端 IP 计算
      SECURITY_TRUST_FORWARDED_FOR: ${SECURITY_TRUST_FORWARDED_FOR:-true}
      UPLOAD_FILE_PATH: /data/upload/
      # 图片直链的前缀。上线后应为 https://coolskyai.com（走 nginx 反代到本服务）
      BLOG_API: ${SITE_URL:-http://localhost:8091}
      # 邮件模板与分享链接里的站点地址：与 SITE_URL 保持一致，避免出现 IP:端口
      BLOG_VIEW: ${BLOG_VIEW:-${SITE_URL:-http://localhost}}
      # 通知邮件里「去后台处理」的链接前缀
      BLOG_CMS: ${BLOG_CMS:-${SITE_URL:-http://localhost}/cms}
      # 邮件服务密码，留空则发信不可用（不影响其他功能）
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # 大模型（OpenAI 兼容）：留空则问答只返回检索片段
      AI_LLM_BASE_URL: ${AI_LLM_BASE_URL:-}
      AI_LLM_API_KEY: ${AI_LLM_API_KEY:-}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-}
      AI_LLM_TIMEOUT: ${AI_LLM_TIMEOUT:-60}
      AI_LLM_MAX_TOKENS: ${AI_LLM_MAX_TOKENS:-800}
      AI_LLM_TEMPERATURE: ${AI_LLM_TEMPERATURE:-0.3}
      # 厂商专有参数（JSON，原样并入请求体）：DeepSeek V4 默认开思考模式，
      # 只要正文就填 {"thinking":{"type":"disabled"}}，否则耗时翻倍
      AI_LLM_EXTRA_BODY: ${AI_LLM_EXTRA_BODY:-}
      # ---- 检索侧：与生成是两套配置 ----
      # hashing（离线字面召回）或 openai（任意 OpenAI 兼容 /embeddings）
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-hashing}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_EMBEDDING_DIM: ${AI_EMBEDDING_DIM:-1024}
      AI_EMBEDDING_BATCH: ${AI_EMBEDDING_BATCH:-16}
      AI_SEARCH_HYBRID_ALPHA: ${AI_SEARCH_HYBRID_ALPHA:-0.65}
      AI_SEARCH_SEMANTIC_FLOOR: ${AI_SEARCH_SEMANTIC_FLOOR:-0.5}
      AI_SEARCH_MIN_SCORE: ${AI_SEARCH_MIN_SCORE:-0.25}
      AI_SEARCH_CHUNKS_PER_DOC: ${AI_SEARCH_CHUNKS_PER_DOC:-2}
      AI_SEARCH_MERGE_LIMIT: ${AI_SEARCH_MERGE_LIMIT:-650}
      AI_CHAT_MIN_SCORE: ${AI_CHAT_MIN_SCORE:-0.25}
      # 追问改写：把「那退款呢」补全成独立问题再检索
      AI_CHAT_REWRITE: ${AI_CHAT_REWRITE:-true}
      AI_CHAT_REWRITE_HISTORY: ${AI_CHAT_REWRITE_HISTORY:-3}
      AI_CHAT_REWRITE_ANSWER: ${AI_CHAT_REWRITE_ANSWER:-300}
      AI_CHAT_REWRITE_ANSWER_ROUNDS: ${AI_CHAT_REWRITE_ANSWER_ROUNDS:-2}
      AI_CHAT_REWRITE_ANSWER_BUDGET: ${AI_CHAT_REWRITE_ANSWER_BUDGET:-600}
      AI_CHAT_REWRITE_MAX_ROUNDS: ${AI_CHAT_REWRITE_MAX_ROUNDS:-5}
      AI_CHAT_REWRITE_ESCALATE: ${AI_CHAT_REWRITE_ESCALATE:-true}
      AI_CHAT_REWRITE_CACHE: ${AI_CHAT_REWRITE_CACHE:-3600}
      # 重排：none（不重排）/ llm（对话模型）/ http（bge-reranker 服务）
      AI_RERANK_PROVIDER: ${AI_RERANK_PROVIDER:-none}
      AI_RERANK_BASE_URL: ${AI_RERANK_BASE_URL:-}
      AI_RERANK_API_KEY: ${AI_RERANK_API_KEY:-}
      AI_RERANK_MODEL: ${AI_RERANK_MODEL:-bge-reranker-v2-m3}
      AI_RERANK_CANDIDATES: ${AI_RERANK_CANDIDATES:-20}
      AI_RERANK_STRICTNESS: ${AI_RERANK_STRICTNESS:-balanced}
      AI_RERANK_MIN_KEEP: ${AI_RERANK_MIN_KEEP:-}
      AI_RERANK_SCORE_MODE: ${AI_RERANK_SCORE_MODE:-auto}
      AI_RERANK_RELATIVE_FLOOR: ${AI_RERANK_RELATIVE_FLOOR:-}
      AI_RERANK_MIN_SCORE: ${AI_RERANK_MIN_SCORE:-0}
      AI_RERANK_CACHE: ${AI_RERANK_CACHE:-900}
      # dev profile 里 com.coolskyai 是 debug 级，生产压到 info 免得日志噪音
      LOGGING_LEVEL_COM_COOLSKYAI: ${LOGGING_LEVEL_COM_COOLSKYAI:-info}
      JAVA_OPTS: "-Xms512m -Xmx1g -Duser.timezone=Asia/Shanghai"
    volumes:
      - upload_data:/data/upload
    # 生产不对外暴露 8091，只允许 compose 内网访问；
    # 需要直连调试时临时加 "127.0.0.1:8091:8091"

  # ---------------- 前台（Nuxt / Nitro） ----------------
  web:
    image: ${REGISTRY:-ghcr.io/edgarmongo}/coolpilot-web:${TAG:-latest}
    container_name: coolpilot-web
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    environment:
      TZ: Asia/Shanghai
      # runtimeConfig.apiBase 的运行时覆盖，仅服务端可见
      NUXT_API_BASE: http://api:8091
      NUXT_TELEMETRY_DISABLED: "1"
    # 不对外映射端口：统一由 gateway 反代（容器间走 compose 内网）

  # ---------------- 管理后台（nginx 静态） ----------------
  admin:
    image: ${REGISTRY:-ghcr.io/edgarmongo}/coolpilot-admin:${TAG:-latest}
    container_name: coolpilot-admin
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    # 不对外映射端口：统一由 gateway 反代

  # ---------------- 统一入口（nginx） ----------------
  gateway:
    image: ${REGISTRY:-ghcr.io/edgarmongo}/coolpilot-gateway:${TAG:-latest}
    container_name: coolpilot-gateway
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      # 用 service_started 而不是 service_healthy：
      # 回滚到旧 tag 时镜像可能没有 HEALTHCHECK，等 healthy 会卡住整个入口。
      # 服务是否真的可用由 /health 与外部探活判断。
      api:
        condition: service_started
      web:
        condition: service_started
      admin:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      # 多个域名用空格分隔：coolskyai.com www.coolskyai.com
      SERVER_NAME: ${SERVER_NAME:-localhost}
      WEB_UPSTREAM: web:8081
      ADMIN_UPSTREAM: admin:80
      API_UPSTREAM: api:8091
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 证书目录：首次启动自动生成自签名，换真实证书后 restart 即可
      - ./certs:/etc/nginx/certs
      # Let's Encrypt HTTP-01 校验用
      - ./certbot/www:/var/www/certbot

volumes:
  mysql_data:
  redis_data:
  upload_data:
