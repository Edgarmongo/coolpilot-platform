# ============================================================
# CoolPilot 本地开发环境
#   docker compose up -d --build     启动
#   docker compose logs -f api       查看后端日志
#   docker compose down              停止（保留数据）
#   docker compose down -v           停止并清空数据卷
# ============================================================

name: coolpilot

services:
  # ---------------- MySQL ----------------
  mysql:
    image: mysql:8.0
    container_name: coolpilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: coolpilot
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      # 映射到 13306，避免与本机已装的 MySQL 冲突
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 表结构与基础数据由应用启动时的 Flyway 迁移负责（coolpilot-server/src/main/resources/db/migration），
      # 不再挂 initdb 脚本：两套初始化机制并存会导致「结构由谁创建」不可控。
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------- Redis ----------------
  redis:
    image: redis:7-alpine
    container_name: coolpilot-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "no"]
    ports:
      # 映射到 16379，避免与本机 Redis 冲突
      - "16379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- 后端 API ----------------
  api:
    build:
      context: .
      dockerfile: deploy/docker/server/Dockerfile
    container_name: coolpilot-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: dev
      # 用环境变量覆盖 application-dev.properties 中的本机配置
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/coolpilot?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # 允许跨域的来源：生产收紧到站点域名，多个用逗号分隔
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:8079,http://127.0.0.1:8081,http://127.0.0.1:8079}
      # 是否信任 X-Forwarded-For：只有反向代理会覆盖该头时才置 true
      SECURITY_TRUST_FORWARDED_FOR: ${SECURITY_TRUST_FORWARDED_FOR:-false}
      # 上传目录改为容器内路径（原配置指向开发者本机 Mac 路径）
      UPLOAD_FILE_PATH: /data/upload/
      # 浏览器访问图片/接口用的地址，指向宿主机映射端口
      BLOG_API: http://localhost:8091
      # 邮件模板与分享链接里的站点地址；不传则用 properties 里的默认值
      BLOG_VIEW: ${BLOG_VIEW:-http://192.236.184.68:8081}
      # 通知邮件里「去后台处理」的链接前缀
      BLOG_CMS: ${BLOG_CMS:-http://localhost:8079/cms}
      # 邮件服务密码，留空则发信不可用（不影响其他功能）
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # 大模型（OpenAI 兼容）：留空则问答只返回检索片段
      # 向量模型（hashing / openai）；换模型或维度后要重建索引
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-hashing}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_EMBEDDING_DIM: ${AI_EMBEDDING_DIM:-1024}
      AI_EMBEDDING_BATCH: ${AI_EMBEDDING_BATCH:-16}
      AI_SEARCH_HYBRID_ALPHA: ${AI_SEARCH_HYBRID_ALPHA:-0.65}
      AI_SEARCH_SEMANTIC_FLOOR: ${AI_SEARCH_SEMANTIC_FLOOR:-0.5}
      AI_SEARCH_MIN_SCORE: ${AI_SEARCH_MIN_SCORE:-0.25}
      AI_CHAT_MIN_SCORE: ${AI_CHAT_MIN_SCORE:-0.25}
      # 追问改写（把「那退款呢」补成独立问题再检索）
      AI_CHAT_REWRITE: ${AI_CHAT_REWRITE:-true}
      # 重排：none / llm（对话模型）/ http（bge-reranker 服务）
      AI_RERANK_PROVIDER: ${AI_RERANK_PROVIDER:-none}
      AI_RERANK_BASE_URL: ${AI_RERANK_BASE_URL:-}
      AI_RERANK_API_KEY: ${AI_RERANK_API_KEY:-}
      AI_RERANK_MODEL: ${AI_RERANK_MODEL:-bge-reranker-v2-m3}
      AI_RERANK_CANDIDATES: ${AI_RERANK_CANDIDATES:-20}
      AI_LLM_BASE_URL: ${AI_LLM_BASE_URL:-}
      AI_LLM_API_KEY: ${AI_LLM_API_KEY:-}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-}
      AI_LLM_TIMEOUT: ${AI_LLM_TIMEOUT:-60}
      AI_LLM_MAX_TOKENS: ${AI_LLM_MAX_TOKENS:-800}
      AI_LLM_TEMPERATURE: ${AI_LLM_TEMPERATURE:-0.3}
      # 厂商专有参数，JSON；DeepSeek 可填 {"thinking":{"type":"disabled"}}
      AI_LLM_EXTRA_BODY: ${AI_LLM_EXTRA_BODY:-}
    # 本地跑 Ollama 时容器要用 host.docker.internal 访问宿主机；Linux 下需要这条映射
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8091:8091"
    volumes:
      - upload_data:/data/upload

  # ---------------- 前台 ----------------
  view:
    build:
      context: .
      dockerfile: deploy/docker/web/Dockerfile
      args:
        APP_DIR: coolpilot-web
    container_name: coolpilot-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TZ: Asia/Shanghai
      # Nuxt 的 Nitro 代理用它拼后端地址（仅服务端可见）
      API_BASE: http://api:8091
      NUXT_TELEMETRY_DISABLED: "1"
    command: ["npx", "nuxt", "dev", "--host", "0.0.0.0", "--port", "8081"]
    ports:
      - "8081:8081"
    volumes:
      - ./coolpilot-web:/app
      # 保留镜像内已安装的依赖，不被源码挂载覆盖
      - view_node_modules:/app/node_modules

  # ---------------- 后台 ----------------
  cms:
    build:
      context: .
      dockerfile: deploy/docker/web/Dockerfile
      args:
        APP_DIR: coolpilot-admin
    container_name: coolpilot-admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TZ: Asia/Shanghai
      # Vite 代理目标
      API_TARGET: http://api:8091
    command: ["npx", "vite", "--host", "0.0.0.0", "--port", "8079"]
    ports:
      - "8079:8079"
    volumes:
      - ./coolpilot-admin:/app
      - cms_node_modules:/app/node_modules

volumes:
  mysql_data:
  upload_data:
  view_node_modules:
  cms_node_modules:
