# ============================================================
# NBlog 本地开发环境
#   docker compose up -d --build     启动
#   docker compose logs -f api       查看后端日志
#   docker compose down              停止（保留数据）
#   docker compose down -v           停止并清空数据卷
# ============================================================

name: nblog

services:
  # ---------------- MySQL ----------------
  mysql:
    image: mysql:8.0
    container_name: nblog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: nblog
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      # 映射到 13306，避免与本机已装的 MySQL 冲突
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 初始化脚本：仅在数据卷为空（首次启动）时按文件名顺序执行
      - ./blog-api/nblog.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./deploy/mysql/02-seed-base.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./blog-api/demo-data.sql:/docker-entrypoint-initdb.d/03-demo.sql:ro
      - ./blog-api/sql/2026-11-04-indexes-and-constraints.sql:/docker-entrypoint-initdb.d/04-indexes.sql:ro
      - ./blog-api/sql/2026-11-04-v1-0-community.sql:/docker-entrypoint-initdb.d/05-community.sql:ro
      - ./blog-api/sql/2026-11-05-v1-1a-file-product.sql:/docker-entrypoint-initdb.d/06-file-product.sql:ro
      - ./deploy/mysql/07-seed-product.sql:/docker-entrypoint-initdb.d/07-seed-product.sql:ro
      - ./blog-api/sql/2026-11-05-v1-1b-order-payment-entitlement.sql:/docker-entrypoint-initdb.d/08-trade.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------- Redis ----------------
  redis:
    image: redis:7-alpine
    container_name: nblog-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "no"]
    ports:
      # 映射到 16379，避免与本机 Redis 冲突
      - "16379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- 后端 API ----------------
  api:
    build:
      context: .
      dockerfile: deploy/docker/api/Dockerfile
    container_name: nblog-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: dev
      # 用环境变量覆盖 application-dev.properties 中的本机配置
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/nblog?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # 上传目录改为容器内路径（原配置指向开发者本机 Mac 路径）
      UPLOAD_FILE_PATH: /data/upload/
      # 浏览器访问图片/接口用的地址，指向宿主机映射端口
      BLOG_API: http://localhost:8091
    ports:
      - "8091:8091"
    volumes:
      - upload_data:/data/upload

  # ---------------- 前台 ----------------
  view:
    build:
      context: .
      dockerfile: deploy/docker/web/Dockerfile
      args:
        APP_DIR: blog-view
    container_name: nblog-view
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TZ: Asia/Shanghai
      API_TARGET: http://api:8091
    command: ["npx", "vue-cli-service", "serve", "--host", "0.0.0.0", "--port", "8081"]
    ports:
      - "8081:8081"
    volumes:
      - ./blog-view:/app
      # 保留镜像内已安装的依赖，不被源码挂载覆盖
      - view_node_modules:/app/node_modules

  # ---------------- 后台 ----------------
  cms:
    build:
      context: .
      dockerfile: deploy/docker/web/Dockerfile
      args:
        APP_DIR: blog-cms
    container_name: nblog-cms
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TZ: Asia/Shanghai
      API_TARGET: http://api:8091
    command: ["npx", "vue-cli-service", "serve", "--host", "0.0.0.0", "--port", "8079"]
    ports:
      - "8079:8079"
    volumes:
      - ./blog-cms:/app
      - cms_node_modules:/app/node_modules

volumes:
  mysql_data:
  upload_data:
  view_node_modules:
  cms_node_modules:
